<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA Music - لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#09090d;--panel:#15141d;--purple:#9b5cff;--text:#f6f2ff;--muted:#aaa4ba;--border:#30283d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
header{padding:22px 16px;background:linear-gradient(120deg,#201035,#0c0b12);border-bottom:1px solid var(--border)}
h1{margin:0;color:#c5a0ff;font-size:25px}
header p{margin:7px 0 0;color:var(--muted)}
main{max-width:1000px;margin:auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:15px}
h2{font-size:19px;margin-top:0}
input,textarea,select,button{font:inherit;width:100%;padding:12px;margin:5px 0;border-radius:9px;border:1px solid var(--border);background:#0d0c13;color:var(--text)}
button{background:var(--purple);color:white;border:0;font-weight:700;cursor:pointer}
button.secondary{background:#292331}
button.danger{background:#8e303e}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:14px}
.tabs button{background:#211b2b;font-size:14px}
.tabs button.active{background:var(--purple)}
.item{padding:12px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}
.item strong{display:block;margin-bottom:5px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}
.actions button{font-size:13px}
.muted{color:var(--muted);font-size:13px}
#message{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;color:#d8c4ff}
.hidden{display:none!important}
label{display:block;margin:9px 0}
@media(min-width:650px){.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
</style>
</head>
<body>
<header>
<h1>NOVA Music</h1>
<p>لوحة الإدارة والتحكم بالمحتوى</p>
</header>

<main>
<div id="message" role="status">جارٍ تجهيز لوحة الإدارة...</div>

<section id="login" class="panel hidden">
<h2>تسجيل دخول المدير</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="البريد الإلكتروني" required autocomplete="username">
<input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password">
<button type="submit">تسجيل الدخول</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<div>الحساب: <strong id="account"></strong></div>
<button class="secondary" id="logout">تسجيل الخروج</button>
</div>

<nav class="tabs">
<button data-tab="tracks" class="active">الأغاني</button>
<button data-tab="categories">التصنيفات</button>
<button data-tab="playlists">قوائم التشغيل</button>
<button data-tab="settings">إعدادات الموقع</button>
</nav>

<section id="tracks" class="panel tab">
<h2>إضافة أو تعديل أغنية</h2>
<form id="trackForm">
<input id="trackId" type="hidden">
<input id="trackTitle" placeholder="اسم الأغنية" required>
<input id="trackArtist" placeholder="اسم الفنان" value="Unknown" required>
<div class="fields">
<input id="trackAudio" type="url" placeholder="رابط ملف الصوت" required>
<input id="trackCover" type="url" placeholder="رابط صورة الغلاف (اختياري)">
</div>
<select id="trackCategory"><option value="">بلا تصنيف</option></select>
<textarea id="trackLyrics" rows="3" placeholder="كلمات الأغنية (اختياري)"></textarea>
<label><input id="trackPublished" type="checkbox" style="width:auto"> نشر الأغنية</label>
<label><input id="trackDownload" type="checkbox" style="width:auto"> السماح بتنزيل محتوى تملك حق توزيعه</label>
<button type="submit">حفظ الأغنية</button>
<button type="button" class="secondary" id="cancelTrack">إلغاء التعديل</button>
</form>
<h2>الأغاني المسجلة</h2>
<div id="trackList"></div>
</section>

<section id="categories" class="panel tab hidden">
<h2>إضافة تصنيف</h2>
<form id="categoryForm">
<input id="categoryName" placeholder="اسم التصنيف" required>
<input id="categorySlug" placeholder="المعرّف بالإنجليزية مثل pop" required>
<button type="submit">إضافة التصنيف</button>
</form>
<div id="categoryList"></div>
</section>

<section id="playlists" class="panel tab hidden">
<h2>إنشاء قائمة تشغيل</h2>
<form id="playlistForm">
<input id="playlistName" placeholder="اسم القائمة" required>
<textarea id="playlistDescription" placeholder="وصف القائمة (اختياري)"></textarea>
<input id="playlistCover" type="url" placeholder="رابط صورة الغلاف (اختياري)">
<label><input id="playlistPublished" type="checkbox" style="width:auto"> نشر القائمة</label>
<button type="submit">إنشاء القائمة</button>
</form>
<div id="playlistList"></div>
</section>

<section id="settings" class="panel tab hidden">
<h2>إعدادات الموقع</h2>
<p class="muted">تُحفظ الإعدادات بصيغة JSON. تغيير هذه القيم لا يغيّر الصفحة الرئيسية تلقائيًا قبل ربطها بها.</p>
<form id="settingForm">
<input id="settingId" type="hidden">
<input id="settingKey" placeholder="اسم الإعداد مثل site_title" required>
<textarea id="settingValue" rows="5" placeholder='قيمة JSON مثل "NOVA Music" أو {"color":"purple"}' required></textarea>
<label><input id="settingPublic" type="checkbox" style="width:auto"> السماح للزوار بقراءة هذا الإعداد</label>
<button type="submit">حفظ الإعداد</button>
</form>
<div id="settingList"></div>
</section>
</section>
</main>

<script>
const SUPABASE_URL = "https://xpwhauincfxreytilrda.supabase.co";
const SUPABASE_KEY = "sb_publishable_Mopifty7o0Sg6hFHi6CoKg_mp6RxV-s";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let user = null;
let tracks = [], categories = [], playlists = [], settings = [];

function say(message){$("message").textContent=message||""}
function showLogin(){$("login").classList.remove("hidden");$("dashboard").classList.add("hidden")}
function showDashboard(){$("login").classList.add("hidden");$("dashboard").classList.remove("hidden")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function errText(e){return e?.message||String(e||"خطأ غير معروف")}
async function query(q){const {data,error}=await q;if(error)throw error;return data}

async function verifyAdmin(){
  const {data:s,error:se}=await db.auth.getSession();
  if(se)throw se;
  if(!s.session){user=null;showLogin();say("سجّل الدخول بحساب المدير.");return false}
  user=s.session.user;
  const {data:ok,error:ae}=await db.rpc("is_admin");
  if(ae)throw new Error("تعذر التحقق من صلاحية المدير: "+ae.message);
  if(ok!==true){await db.auth.signOut();user=null;showLogin();say("هذا الحساب ليس مديرًا.");return false}
  $("account").textContent=user.email||"مدير";
  showDashboard();
  return true;
}

async function loadAll(){
  try{
    say("جارٍ تحميل البيانات...");
    [tracks,categories,playlists,settings]=await Promise.all([
      query(db.from("tracks").select("*").order("id",{ascending:false})),
      query(db.from("categories").select("*").order("id")),
      query(db.from("playlists").select("*").order("id",{ascending:false})),
      query(db.from("site_settings").select("*").order("id",{ascending:false}))
    ]);
    renderTracks();renderCategories();renderPlaylists();renderSettings();
    say("تم تحميل البيانات.");
  }catch(e){say("خطأ في تحميل البيانات:\n"+errText(e))}
}

function renderTracks(){
  $("trackList").innerHTML=tracks.map(t=>`
  <div class="item"><strong>${esc(t.title)}</strong>
  <div class="muted">${esc(t.artist)} · ${t.is_published?"منشورة":"مسودة"} · ${t.allow_download?"التنزيل مسموح":"التنزيل ممنوع"}</div>
  <div class="actions">
  <button class="secondary" data-edit-track="${t.id}">تعديل</button>
  <button data-pub-track="${t.id}">${t.is_published?"إلغاء النشر":"نشر"}</button>
  <button class="secondary" data-dl-track="${t.id}">${t.allow_download?"منع التنزيل":"السماح بالتنزيل"}</button>
  <button class="danger" data-del-track="${t.id}">حذف</button>
  </div></div>`).join("")||'<p class="muted">لا توجد أغاني.</p>';
  $("trackCategory").innerHTML='<option value="">بلا تصنيف</option>'+categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
}
function renderCategories(){
  $("categoryList").innerHTML=categories.map(c=>`
  <div class="item"><strong>${esc(c.name)}</strong><div class="muted">${esc(c.slug)} · ${c.is_active?"نشط":"مخفي"}</div>
  <div class="actions"><button data-toggle-cat="${c.id}">${c.is_active?"إخفاء":"تفعيل"}</button><button class="danger" data-del-cat="${c.id}">حذف</button></div></div>`).join("")||'<p class="muted">لا توجد تصنيفات.</p>';
}
function renderPlaylists(){
  $("playlistList").innerHTML=playlists.map(p=>`
  <div class="item"><strong>${esc(p.name)}</strong><div class="muted">${p.is_published?"منشورة":"مسودة"}</div>
  <div class="actions"><button data-toggle-play="${p.id}">${p.is_published?"إلغاء النشر":"نشر"}</button><button class="danger" data-del-play="${p.id}">حذف</button></div></div>`).join("")||'<p class="muted">لا توجد قوائم.</p>';
}
function renderSettings(){
  $("settingList").innerHTML=settings.map(s=>`
  <div class="item"><strong>${esc(s.setting_key)}</strong><div class="muted">مرئي للزوار: ${s.is_public?"نعم":"لا"}</div>
  <div class="actions"><button class="secondary" data-edit-setting="${s.id}">تعديل</button><button class="danger" data-del-setting="${s.id}">حذف</button></div></div>`).join("")||'<p class="muted">لا توجد إعدادات.</p>';
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    say("جارٍ تسجيل الدخول...");
    const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
    if(error)throw error;
    $("password").value="";
    if(await verifyAdmin())await loadAll();
  }catch(e){say("فشل تسجيل الدخول أو التحقق:\n"+errText(e))}
});
$("logout").addEventListener("click",async()=>{
  await db.auth.signOut();user=null;showLogin();say("تم تسجيل الخروج.");
});

document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));
  $(b.dataset.tab).classList.remove("hidden");
}));

$("trackForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const id=$("trackId").value;
    const item={
      title:$("trackTitle").value.trim(),
      artist:$("trackArtist").value.trim()||"Unknown",
      audio_url:$("trackAudio").value.trim(),
      cover_url:$("trackCover").value.trim()||null,
      lyrics:$("trackLyrics").value||null,
      category_id:$("trackCategory").value||null,
      is_published:$("trackPublished").checked,
      allow_download:$("trackDownload").checked
    };
    await query(id?db.from("tracks").update(item).eq("id",id):db.from("tracks").insert(item));
    $("trackForm").reset();$("trackId").value="";$("trackArtist").value="Unknown";
    say("تم حفظ الأغنية.");await loadAll();
  }catch(e){say("تعذر حفظ الأغنية:\n"+errText(e))}
});
$("cancelTrack").addEventListener("click",()=>{
  $("trackForm").reset();$("trackId").value="";$("trackArtist").value="Unknown";
});

$("categoryForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    await query(db.from("categories").insert({name:$("categoryName").value.trim(),slug:$("categorySlug").value.trim(),is_active:true}));
    $("categoryForm").reset();say("تمت إضافة التصنيف.");await loadAll();
  }catch(e){say("تعذر إضافة التصنيف:\n"+errText(e))}
});

$("playlistForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    await query(db.from("playlists").insert({
      name:$("playlistName").value.trim(),
      description:$("playlistDescription").value.trim()||null,
      cover_url:$("playlistCover").value.trim()||null,
      is_published:$("playlistPublished").checked
    }));
    $("playlistForm").reset();say("تم إنشاء القائمة.");await loadAll();
  }catch(e){say("تعذر إنشاء القائمة:\n"+errText(e))}
});

$("settingForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    let value;
    try{value=JSON.parse($("settingValue").value)}catch{throw new Error("قيمة الإعداد ليست JSON صالحًا.")}
    const id=$("settingId").value;
    const item={setting_key:$("settingKey").value.trim(),setting_value:value,is_public:$("settingPublic").checked};
    await query(id?db.from("site_settings").update(item).eq("id",id):db.from("site_settings").insert(item));
    $("settingForm").reset();$("settingId").value="";
    say("تم حفظ الإعداد.");await loadAll();
  }catch(e){say("تعذر حفظ الإعداد:\n"+errText(e))}
});

document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  try{
    if(b.dataset.editTrack){
      const t=tracks.find(x=>String(x.id)===b.dataset.editTrack);if(!t)return;
      $("trackId").value=t.id;$("trackTitle").value=t.title||"";$("trackArtist").value=t.artist||"";
      $("trackAudio").value=t.audio_url||"";$("trackCover").value=t.cover_url||"";
      $("trackLyrics").value=t.lyrics||"";$("trackCategory").value=t.category_id||"";
      $("trackPublished").checked=!!t.is_published;$("trackDownload").checked=!!t.allow_download;
      window.scrollTo({top:0,behavior:"smooth"});
    }
    if(b.dataset.pubTrack){
      const t=tracks.find(x=>String(x.id)===b.dataset.pubTrack);
      await query(db.from("tracks").update({is_published:!t.is_published}).eq("id",t.id));await loadAll();
    }
    if(b.dataset.dlTrack){
      const t=tracks.find(x=>String(x.id)===b.dataset.dlTrack);
      await query(db.from("tracks").update({allow_download:!t.allow_download}).eq("id",t.id));await loadAll();
    }
    if(b.dataset.delTrack&&confirm("هل تريد حذف هذه الأغنية؟")){
      await query(db.from("tracks").delete().eq("id",b.dataset.delTrack));await loadAll();
    }
    if(b.dataset.toggleCat){
      const c=categories.find(x=>String(x.id)===b.dataset.toggleCat);
      await query(db.from("categories").update({is_active:!c.is_active}).eq("id",c.id));await loadAll();
    }
    if(b.dataset.delCat&&confirm("قد يفشل الحذف إذا كان التصنيف مرتبطًا بأغانٍ. هل تتابع؟")){
      await query(db.from("categories").delete().eq("id",b.dataset.delCat));await loadAll();
    }
    if(b.dataset.togglePlay){
      const p=playlists.find(x=>String(x.id)===b.dataset.togglePlay);
      await query(db.from("playlists").update({is_published:!p.is_published}).eq("id",p.id));await loadAll();
    }
    if(b.dataset.delPlay&&confirm("هل تريد حذف قائمة التشغيل؟")){
      await query(db.from("playlists").delete().eq("id",b.dataset.delPlay));await loadAll();
    }
    if(b.dataset.editSetting){
      const s=settings.find(x=>String(x.id)===b.dataset.editSetting);if(!s)return;
      $("settingId").value=s.id;$("settingKey").value=s.setting_key;
      $("settingValue").value=JSON.stringify(s.setting_value,null,2);
      $("settingPublic").checked=!!s.is_public;window.scrollTo({top:0,behavior:"smooth"});
    }
    if(b.dataset.delSetting&&confirm("هل تريد حذف هذا الإعداد؟")){
      await query(db.from("site_settings").delete().eq("id",b.dataset.delSetting));await loadAll();
    }
  }catch(e){say("تعذر تنفيذ العملية:\n"+errText(e))}
});

async function start(){
  try{
    if(await verifyAdmin())await loadAll();
  }catch(e){showLogin();say("تعذر تشغيل لوحة الإدارة:\n"+errText(e))}
}
start();
</script>
</body>
</html>
